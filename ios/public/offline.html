<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#005DFD" />
    <title>Parcel Yatra — offline</title>
    <!--
      The page a phone shows when it cannot reach the API at all. Fully self-contained: no scripts, no
      external images, no /v1 call, because it has to render from the cache on a plane or in a basement.
      Everything on it is true — a cached booking really is still readable once the signal returns.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: linear-gradient(180deg, #005dfd 0%, #0039b8 100%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 10px 44px rgba(0, 0, 0, 0.28);
      }
      h1 {
        margin: 20px 0 6px;
        font-size: 24px;
        line-height: 30px;
        font-weight: 700;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 22px;
        color: rgba(255, 255, 255, 0.82);
      }
      a {
        display: inline-block;
        margin-top: 26px;
        min-height: 52px;
        line-height: 52px;
        padding: 0 30px;
        border-radius: 12px;
        background: #fff;
        color: #0a57ff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }
      small {
        display: block;
        margin-top: 18px;
        font-size: 12px;
        line-height: 16px;
        color: rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-180.png" alt="Parcel Yatra" />
      <h1>No connection</h1>
      <p>Parcel Yatra cannot reach the network right now. Your bookings and messages are safe — they load as soon as you are back online.</p>
      <a href="/" rel="home">Try again</a>
      <small>Live tracking pauses while you are offline and resumes on its own.</small>
    </main>
  </body>
</html>
