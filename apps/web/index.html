<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001366" />
    <meta
      name="description"
      content="Parcel Yatra — send a small sealed parcel between cities with someone already making the journey."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!--
      The hero photograph is the entry page's largest element, and without this the request cannot
      start until React has mounted. Preloaded here it is in flight while the bundle parses.
    -->
    <link
      rel="preload"
      as="image"
      href="/hero-background.webp"
      fetchpriority="high"
    />
    <title>Parcel Yatra — send it with someone already going</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
